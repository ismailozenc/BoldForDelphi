; The settings of the propagator server, read when it starts (TBoldPropagatorServer.LoadConfiguration), as Delphi's
; enterprise propagator read its INI file. The values below are the defaults; a missing file or value keeps them.
; The server's address is not set here but with --urls or ASPNETCORE_URLS.

[FILE LOGGING]
; 1 writes the log to Bold.Propagator.Server.log next to the program (and errors to .error); the folder must be writable.
ENABLED=0
; The size in bytes past which a log file is emptied and written from the start again; 0 for no limit.
MAXFILESIZE=0
; 1 also writes the thread log (.thread) that Bold.PropagatorAnalyzer reads, to find lock orders that can deadlock.
THREAD=0

[CONFIG PARAMS]
; The number of threads that send events to the clients.
THREADPOOLSIZE=15
; 1 disconnects a client that cannot be reached when an event is sent to it.
DISCONNECTCLIENTSONSENDFAILURE=1

[COM SERVER]
; The server's name, as it reports it.
SERVERNAME=EnterprisePropagator
