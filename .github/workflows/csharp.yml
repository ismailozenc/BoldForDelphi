name: C# port

on:
  push:
    paths:
      - 'CSharp/**'
      - 'Source/**'
      - 'Tools/**'
      - '.github/workflows/csharp.yml'
  pull_request:
    paths:
      - 'CSharp/**'
      - 'Source/**'
      - 'Tools/**'
      - '.github/workflows/csharp.yml'
  workflow_dispatch:

concurrency:
  group: csharp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-check:
    name: Build, test and check the port links
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # Errors are repeated as annotations, so they can be read from the run's summary.
      - name: Restore
        run: |
          set -o pipefail
          dotnet restore CSharp/Bold.slnx 2>&1 | tee restore.log || { grep -E ": (error|warning) " restore.log | sort -u | head -50 | sed 's/^/::error::/'; exit 1; }

      - name: Build
        run: |
          set -o pipefail
          dotnet build CSharp/Bold.slnx --configuration Release --no-restore 2>&1 | tee build.log

      # A step shows at most ten annotations, so all build errors go in one, in a step of its own.
      - name: Build errors
        if: failure()
        run: |
          tr -d '\r' < build.log | grep -E ": error " | sed -E 's#^.*[\\/]CSharp[\\/]#CSharp/#; s# \[[^]]*\]$##' | sort -u > errors.txt
          echo "::error::$(wc -l < errors.txt) build errors:%0A$(head -300 errors.txt | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"

      # Failed tests are repeated as one annotation per test project, so they can be read from the run's summary.
      - name: Test
        run: |
          failed=0
          counts=""
          for project in CSharp/tests/*.Tests/*.Tests.csproj; do
            name=$(basename "$project" .csproj)
            if dotnet test "$project" --configuration Release --no-build --logger trx --logger "console;verbosity=normal" --results-directory "CSharp/TestResults/$name" > "test-$name.log" 2>&1; then
              grep -E "^\s*(Passed|Failed|Skipped|Total)( tests)?[:!]|^Test Run" "test-$name.log" | tail -3
              counts="$counts$name: $( (tr -d '\r' < "test-$name.log" | grep -E '^ *(Total tests|Passed|Failed|Skipped): ' | sed -E 's/^ +//' | paste -sd ',' -) || true)%0A"
            else
              failed=1
              tail -30 "test-$name.log"
              echo "::error::$name failed:%0A$( (grep -E '(Failed|Passed)! +-|^Total tests|^ +(Passed|Failed|Skipped): +[0-9]' "test-$name.log"; tr -d '\r' < "test-$name.log" | awk '/^ *Failed /{p=1} /^ *(Passed|Skipped) /{p=0} p') | head -300 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
            fi
          done
          # The counts in one annotation, which the GitHub API gives to tools that cannot read the job log.
          echo "::notice title=Tests::$counts"
          exit $failed

      - name: Check port links
        if: ${{ !cancelled() }}
        run: dotnet run --project CSharp/tools/Bold.PortTool --configuration Release --no-build -- check --results CSharp/TestResults

      - name: Port status on the job page
        if: ${{ !cancelled() }}
        run: |
          dotnet run --project CSharp/tools/Bold.PortTool --configuration Release --no-build -- summary --results CSharp/TestResults --out "$GITHUB_STEP_SUMMARY"
          # The milestone rows in one annotation as well, for tools that cannot read the job page.
          echo "::notice title=Port status::$(grep -E '^\| (M[0-9]+|Later|✅)' "$GITHUB_STEP_SUMMARY" | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"

      - name: Port status pages
        if: ${{ !cancelled() }}
        run: dotnet run --project CSharp/tools/Bold.PortTool --configuration Release --no-build -- report --results CSharp/TestResults

      - name: Upload status pages and test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: port-status
          path: |
            CSharp/port/PORT_STATUS.md
            CSharp/port/units/
            CSharp/TestResults/

  sqlserver:
    name: SQL Server
    runs-on: ubuntu-latest
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: 'Y'
          MSSQL_SA_PASSWORD: 'Bold_Test_2026!'
        ports:
          - 1433:1433
    env:
      BOLD_SQLSERVER: 'Server=localhost,1433;User Id=sa;Password=Bold_Test_2026!;TrustServerCertificate=True;Connect Timeout=60'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Build the SQL tests
        run: |
          set -o pipefail
          dotnet build CSharp/tests/Bold.Persistence.Sql.Tests --configuration Release 2>&1 | tee build.log || { grep -E ": error " build.log | sort -u | head -50 | sed 's/^/::error::/'; exit 1; }

      # The server takes a while to accept logins after the container starts.
      - name: Wait for SQL Server
        run: |
          for i in $(seq 1 60); do
            if (echo > /dev/tcp/localhost/1433) 2>/dev/null; then sleep 10; exit 0; fi
            sleep 2
          done
          echo "::error::SQL Server did not start"; exit 1

      # Failures are repeated as annotations, so they can be read from the run's summary.
      - name: Test on SQL Server
        run: |
          set -o pipefail
          dotnet test CSharp/tests/Bold.Persistence.Sql.Tests --configuration Release --no-build --filter "TestCategory=SqlServer" --logger "console;verbosity=normal" 2>&1 | tee test.log || { grep -E -A6 "^\s*(Failed|Error Message:)" test.log | head -60 | tr -d '\r' | sed 's/^/::error::/'; exit 1; }
          # Ignored tests would also pass: make sure the SQL Server tests ran.
          grep -qE "^ *Passed: +[1-9]" test.log && ! grep -qiE "skipped: +[1-9]|^ *Skipped " test.log || { echo "::error::The SQL Server tests did not run (ignored or none found)"; exit 1; }
